name: validate
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # SceneWorks fork: upstream targets paid blaze/* runners this fork has no
    # subscription to (jobs never get picked up). Use GitHub-hosted macOS.
    runs-on: macos-15
    # Cold cache builds MLX C++ from source on a 3-core VM; guard against a
    # wedged job eating the 6h default (macOS concurrency pool is only 5 jobs).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: sudo xcodes select 16.4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo --version
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

  tests:
    runs-on: ${{ matrix.runner }}
    # Cold MLX C++ build + single-threaded test suite; see checks job note.
    timeout-minutes: 180
    strategy:
      matrix:
        runner: [macos-15]
        rust: [1.85.0, stable]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: sudo xcodes select 16.4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: ${{ matrix.rust }}
          rustflags: "" # Disable when we're ready
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}-${{ matrix.runner }}-${{ hashFiles('**/Cargo.toml') }}
      # yoke-derive 0.8.3 (transitive, via the mistral example's hf-hub -> url -> icu) calls an API
      # rustc 1.85 lacks and declares no rust-version, so resolver = "3" cannot skip it. Hold the
      # MSRV leg on 0.8.2; drop this step once yoke-derive fixes 1.85 or declares its rust-version.
      - if: matrix.rust == '1.85.0'
        run: cargo update -p yoke-derive --precise 0.8.2
      - run: cargo test --all -- --test-threads=1 # MLX is not thread safe
