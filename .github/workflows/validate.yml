name: validate
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # SceneWorks fork: upstream targets paid blaze/* runners this fork has no
    # subscription to (jobs never get picked up). Use GitHub-hosted macOS.
    runs-on: macos-15
    # Cold cache builds MLX C++ from source on a 3-core VM; guard against a
    # wedged job eating the 6h default (macOS concurrency pool is only 5 jobs).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - run: sudo xcodes select 16.4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          # Preserve the full test job's warning treatment for compile-only tests.
          # Production and audited I/O Clippy commands still deny warnings explicitly.
          rustflags: ""
      - run: cargo --version
      - name: Validate workflow execution profiles
        run: ruby .github/tests/validation_profiles_test.rb
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clippy -p pmetal-mlx-rs --test load_errors --test load_progress -- -D warnings
      # Keep broad test compilation; full execution is in explicit model validation.
      - run: cargo test --all --no-run
      # load_errors uses raw add/square/sum on CPU/GPU to propagate I/O failures, and
      # load_progress copies CPU Load bytes. Neither target executes a learned module.
      - run: cargo test -p pmetal-mlx-rs --test load_errors --test load_progress -- --test-threads=1
