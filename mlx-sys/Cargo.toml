[package]
name = "pmetal-mlx-sys"
version = "0.2.4" # mlx-sys version should follow that of mlx-c
authors.workspace = true
edition.workspace = true

description = "pmetal-maintained fork of mlx-sys: low-level interface and binding generation for the mlx library"
repository = "https://github.com/oxiglade/mlx-rs"
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

# sc-12940: the fork renamed the PACKAGE to pmetal-mlx-sys, but the lib target
# must keep the upstream crate name. Dependents already import it as `mlx_sys`
# via workspace aliasing, and this crate's own examples refer to `mlx_sys`.
[lib]
name = "mlx_sys"

[package.metadata.docs.rs]
targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
]

[features]
default = ["accelerate", "metal"]

accelerate = []
metal = []

[dependencies]

[build-dependencies]
bindgen.workspace = true
cmake.workspace = true
cc.workspace = true
